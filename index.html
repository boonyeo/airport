<!DOCTYPE html>
<html>
<head>
    <title>AI Adoption Advantage</title>
    <style>
        body { margin: 0; display: flex; flex-direction: column; align-items: center; background: #1a252f; color: white; font-family: sans-serif; overflow-y: auto; overflow-x: hidden; }
        .header { padding: 16px 20px 8px; text-align: center; }
        .header h1 { margin: 0 0 4px; font-size: 1.4em; letter-spacing: 2px; color: #f1c40f; text-transform: uppercase; }
        .header p { margin: 0; font-size: 0.82em; color: #95a5a6; }
        .controls { background: #2c3e50; padding: 14px 20px; width: 100%; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 5; position: relative; }
        canvas { background: #fff; display: block; min-height: 600px; }
        .control-group { display: flex; flex-direction: column; align-items: center; min-width: 150px; }
        span { margin-top: 5px; font-family: monospace; color: #f1c40f; font-size: 1.1em; }
        .label-text { font-weight: bold; margin-bottom: 4px; font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; }
        .hint { font-size: 0.72em; color: #7f8c8d; margin-bottom: 4px; text-align: center; }
    </style>
</head>
<body>

    <div class="header">
        <h1>AI Adoption Advantage</h1>
        <p>Early adopters slow down briefly to learn — then compound ahead permanently</p>
    </div>

    <div class="controls">
        <div class="control-group">
            <span class="label-text">Normal Work Speed</span>
            <input type="range" id="walkSlider" min="0.5" max="4" step="0.1" value="1.0">
            <span id="xVal">1.0</span>
        </div>
        <div class="control-group">
            <span class="label-text">Learning Phase Speed</span>
            <span class="hint">lower = steeper learning curve</span>
            <input type="range" id="zSlider" min="0.1" max="6" step="0.1" value="0.7">
            <span id="zVal">0.7</span>
        </div>
        <div class="control-group">
            <span class="label-text">AI Productivity Boost</span>
            <span class="hint">compounds over time</span>
            <input type="range" id="ySlider" min="0.1" max="6" step="0.1" value="2.0">
            <span id="yVal">2.0</span>
        </div>
    </div>

    <canvas id="airportCanvas"></canvas>

    <script>
        const canvas = document.getElementById('airportCanvas');
        const ctx = canvas.getContext('2d');
        
        let frame = 0;
        let xPosA = 0, xPosB = 0;
        let zTexOffset = 0, yTexOffset = 0;
        let entryA, entryB, zone1Len, transA, transB;
        let z2StartA = null, z2StartB = null;

        let manualSpeedOffsetA = 0;

        // Keyboard Listener
        window.addEventListener('keydown', (e) => {
            if (e.key === "ArrowRight" || e.key === "." || e.key === ">") {
                manualSpeedOffsetA += 0.1;
            } else if (e.key === "ArrowLeft" || e.key === "," || e.key === "<") {
                manualSpeedOffsetA -= 0.1;
            }
            manualSpeedOffsetA = Math.max(-0.9, manualSpeedOffsetA);
        });

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = 650; 
            entryA = canvas.width * 0.15; 
            entryB = canvas.width * 0.25; 
            zone1Len = (canvas.width - entryA) * (1/6);
            transA = entryA + zone1Len;
            transB = entryB + zone1Len;
        }

        window.addEventListener('resize', resize);
        resize();

        function drawBeltTexture(x, y, w, h, _speed, isZ) {
            ctx.save();
            ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); 
            ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
            ctx.lineWidth = 2;
            let spacing = 35;
            let offset = isZ ? zTexOffset : yTexOffset;
            for (let i = x + (offset % spacing) - spacing; i < x + w + spacing; i += spacing) {
                ctx.beginPath(); ctx.moveTo(i, y); ctx.lineTo(i - 15, y + h); ctx.stroke();
            }
            ctx.restore();
        }

        function drawDistanceMarker(x1, x2) {
            const yPos = 218;
            const gap = x1 - x2;
            const aAhead = gap > 0;
            const color = aAhead ? "#27ae60" : "#e74c3c";
            ctx.strokeStyle = color; ctx.fillStyle = color;
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath(); ctx.moveTo(x1, yPos); ctx.lineTo(x2, yPos); ctx.stroke();
            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(x1, yPos - 5); ctx.lineTo(x1, yPos + 5);
            ctx.moveTo(x2, yPos - 5); ctx.lineTo(x2, yPos + 5);
            ctx.stroke();
            ctx.font = "bold 13px monospace"; ctx.textAlign = "center";
            const label = aAhead
                ? `Productivity Gap: +${gap.toFixed(0)}  ▶▶`
                : `Early adopter learning  (gap: ${gap.toFixed(0)})`;
            ctx.fillText(label, (x1 + x2) / 2, yPos + 22);
        }

        function drawTrack(trackY, entryX, transX, personLabel, speedZ2) {
            const h = 100;
            // Normal work zone
            ctx.fillStyle = "#dcdde1"; ctx.fillRect(0, trackY, entryX, h);
            // Learning phase — purple (avoids orange person A, blue person B, green zone 2, yellow markers)
            ctx.fillStyle = "#7d3c98"; ctx.fillRect(entryX, trackY, zone1Len, h);
            // AI-augmented — green
            ctx.fillStyle = "#1e8449"; ctx.fillRect(transX, trackY, canvas.width - transX, h);

            // Zone labels
            ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center";
            if (entryX > 60) {
                ctx.fillStyle = "rgba(0,0,0,0.35)";
                ctx.fillText("Normal Work", entryX / 2, trackY + 18);
            }
            ctx.fillStyle = "rgba(255,255,255,0.9)";
            ctx.fillText("Learning AI", entryX + zone1Len / 2, trackY + 18);
            ctx.font = "9px sans-serif";
            ctx.fillStyle = "rgba(230,200,255,0.9)";
            ctx.fillText("(temporary slowdown)", entryX + zone1Len / 2, trackY + 31);

            ctx.font = "bold 11px sans-serif";
            ctx.fillStyle = "rgba(255,255,255,0.9)";
            ctx.fillText("AI-Augmented Productivity", transX + (canvas.width - transX) / 2, trackY + 18);
            ctx.font = "9px sans-serif";
            ctx.fillStyle = "rgba(180,255,200,0.9)";
            ctx.fillText(`(compounding  ·  v=${speedZ2.toFixed(2)})`, transX + (canvas.width - transX) / 2, trackY + 31);

            // Person label
            ctx.fillStyle = personLabel === "Early Adopter" ? "#e67e22" : "#3498db";
            ctx.font = "bold 12px sans-serif"; ctx.textAlign = "left";
            ctx.fillText(personLabel, 8, trackY - 8);

            // Zone boundary markers
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#f1c40f";
            ctx.setLineDash([6, 3]);
            ctx.beginPath(); ctx.moveTo(entryX, trackY); ctx.lineTo(entryX, trackY + h); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = "#f1c40f"; ctx.font = "bold 9px sans-serif"; ctx.textAlign = "center";
            ctx.fillText("▼ Adopts AI", entryX, trackY - 2);

            ctx.strokeStyle = "#27ae60";
            ctx.beginPath(); ctx.moveTo(transX, trackY); ctx.lineTo(transX, trackY + h); ctx.stroke();

            // Track floor line
            ctx.fillStyle = "#bdc3c7"; ctx.fillRect(0, trackY + h, canvas.width, 4);
        }

        function drawEnvironment(z, speedA, speedB) {
            ctx.fillStyle = "#ecf0f1"; ctx.fillRect(0, 0, canvas.width, canvas.height);

            zTexOffset -= z;
            yTexOffset -= ((speedA + speedB) / 2);

            drawTrack(50, entryA, transA, "Early Adopter", speedA);
            drawBeltTexture(entryA, 50, zone1Len, 100, z, true);
            drawBeltTexture(transA, 50, canvas.width - transA, 100, speedA, false);

            drawTrack(300, entryB, transB, "Late Adopter", speedB);
            drawBeltTexture(entryB, 300, zone1Len, 100, z, true);
            drawBeltTexture(transB, 300, canvas.width - transB, 100, speedB, false);
        }

        function drawPerson(x, y, color, speedLabel, isWalking, bonus) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = color;
            ctx.fillRect(-12, -60, 24, 50);
            ctx.beginPath(); ctx.arc(0, -75, 12, 0, Math.PI * 2); ctx.fill();

            let walkRate = parseFloat(document.getElementById('walkSlider').value) + bonus;
            let legAngle = isWalking ? Math.sin(frame * walkRate * 0.15) * 18 : 0;
            ctx.strokeStyle = "#222"; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(0, -15); ctx.lineTo(legAngle, 5); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, -15); ctx.lineTo(-legAngle, 5); ctx.stroke();

            ctx.fillStyle = "rgba(0,0,0,0.8)";
            ctx.font = "bold 14px monospace"; ctx.textAlign = "center";
            ctx.fillText("v=" + speedLabel, 0, -100);
            
            if (bonus !== 0) {
                ctx.fillStyle = bonus > 0 ? "#27ae60" : "#c0392b";
                ctx.font = "bold 10px sans-serif";
                ctx.fillText(bonus > 0 ? "+" + bonus.toFixed(1) : bonus.toFixed(1), 0, -115);
            }
            ctx.restore();
        }

        function animate() {
            const x = parseFloat(document.getElementById('walkSlider').value);
            const z = parseFloat(document.getElementById('zSlider').value);
            const yBase = parseFloat(document.getElementById('ySlider').value);
            
            document.getElementById('xVal').innerText = x.toFixed(1);
            document.getElementById('zVal').innerText = z.toFixed(1);
            document.getElementById('yVal').innerText = yBase.toFixed(1);

            let speedA, walkA = false;
            let currentX_A = x + manualSpeedOffsetA; 

            if (xPosA < entryA) { speedA = currentX_A; walkA = true; }
            else if (xPosA < transA) { speedA = z + manualSpeedOffsetA; }
            else { 
                if (z2StartA === null) z2StartA = frame;
                speedA = yBase + ((frame - z2StartA) / 60 * 0.4) + manualSpeedOffsetA;
            }
            xPosA += speedA;

            let speedB, walkB = false;
            if (xPosB < entryB) { speedB = x; walkB = true; }
            else if (xPosB < transB) { speedB = z; }
            else { 
                if (z2StartB === null) z2StartB = frame;
                speedB = yBase + ((frame - z2StartB) / 60 * 0.4);
            }
            xPosB += speedB;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawEnvironment(z, (xPosA < transA ? yBase : speedA - manualSpeedOffsetA), (xPosB < transB ? yBase : speedB));

            drawDistanceMarker(xPosA, xPosB);

            if (xPosA > canvas.width + 50 && xPosB > canvas.width + 50) {
                xPosA = 0; xPosB = 0;
                z2StartA = null; z2StartB = null;
                manualSpeedOffsetA = 0; 
            }

            drawPerson(xPosA, 135, "#e67e22", speedA.toFixed(2), walkA, manualSpeedOffsetA);
            drawPerson(xPosB, 385, "#3498db", speedB.toFixed(2), walkB, 0);

            frame++;
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
