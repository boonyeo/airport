<!DOCTYPE html>
<html>
<head>
    <title>Airport Simulation: Clean Scroll</title>
    <style>
        body { 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background: #2c3e50; 
            color: white; 
            font-family: sans-serif; 
            /* Allows natural scrolling */
            overflow-y: auto; 
            overflow-x: hidden; 
        }
        
        .controls { 
            background: #34495e; 
            padding: 20px; 
            width: 100%; 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            flex-wrap: wrap;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); 
            z-index: 5;
            /* Controls now scroll away with the page */
            position: relative; 
        }

        canvas { 
            background: #fff; 
            display: block; 
            /* Ensures both belts always have space regardless of window height */
            min-height: 600px; 
        }

        .control-group { display: flex; flex-direction: column; align-items: center; min-width: 130px; }
        span { margin-top: 5px; font-family: monospace; color: #f1c40f; font-size: 1.1em; }
        .label-text { font-weight: bold; margin-bottom: 8px; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; }
        
        .hint {
            padding: 10px;
            font-size: 0.8em;
            color: #bdc3c7;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="control-group">
            <span class="label-text">Walk (x)</span>
            <input type="range" id="walkSlider" min="0.5" max="4" step="0.1" value="1.0">
            <span id="xVal">1.0</span>
        </div>
        <div class="control-group">
            <span class="label-text">Zone 1 (z)</span>
            <input type="range" id="zSlider" min="0.1" max="6" step="0.1" value="0.7">
            <span id="zVal">0.7</span>
        </div>
        <div class="control-group">
            <span class="label-text">Zone 2 (y)</span>
            <input type="range" id="ySlider" min="0.1" max="6" step="0.1" value="2.0">
            <span id="yVal">2.0</span>
        </div>
    </div>
    
    <div class="hint">Scroll down to see both belts in action ↓</div>

    <canvas id="airportCanvas"></canvas>

    <script>
        const canvas = document.getElementById('airportCanvas');
        const ctx = canvas.getContext('2d');
        
        let frame = 0;
        let xPosA = 0, xPosB = 0;
        let zTexOffset = 0, yTexOffset = 0;
        let entryA, entryB, zone1Len, transA, transB;

        let z2StartA = null, z2StartB = null;

        function resize() {
            canvas.width = window.innerWidth;
            // Provide enough height for the lane logic + margins
            canvas.height = 650; 
            
            entryA = canvas.width * 0.15; 
            entryB = canvas.width * 0.25; 
            zone1Len = (canvas.width - entryA) * (1/6);
            transA = entryA + zone1Len;
            transB = entryB + zone1Len;
        }

        window.addEventListener('resize', resize);
        resize();

        function drawBeltTexture(x, y, w, h, speed, isZ) {
            ctx.save();
            ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); 
            ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
            ctx.lineWidth = 2;
            let spacing = 35;
            let offset = isZ ? zTexOffset : yTexOffset;
            for (let i = x + (offset % spacing) - spacing; i < x + w + spacing; i += spacing) {
                ctx.beginPath(); ctx.moveTo(i, y); ctx.lineTo(i - 15, y + h); ctx.stroke();
            }
            ctx.restore();
        }

        function drawDistanceMarker(x1, x2) {
            const yPos = 210; 
            const dist = (x1 - x2).toFixed(1);
            
            ctx.strokeStyle = "#27ae60";
            ctx.fillStyle = "#27ae60";
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);

            ctx.beginPath();
            ctx.moveTo(x1, yPos);
            ctx.lineTo(x2, yPos);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.beginPath();
            ctx.moveTo(x1, yPos - 5); ctx.lineTo(x1, yPos + 5);
            ctx.moveTo(x2, yPos - 5); ctx.lineTo(x2, yPos + 5);
            ctx.stroke();

            ctx.font = "bold 13px monospace";
            ctx.textAlign = "center";
            ctx.fillText(`Relative Distance: ${dist}`, (x1 + x2) / 2, yPos + 22);
        }

        function drawEnvironment(z, yBase, speedA, speedB) {
            ctx.fillStyle = "#ecf0f1"; ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Top Belt (Lane A)
            ctx.fillStyle = "#dcdde1"; ctx.fillRect(0, 50, entryA, 100);
            ctx.fillStyle = "#34495e"; ctx.fillRect(entryA, 50, zone1Len, 100);
            ctx.fillStyle = "#2c3e50"; ctx.fillRect(transA, 50, canvas.width - transA, 100);

            // Bottom Belt (Lane B)
            const yOffsetB = 300; // Increased spacing for even more clarity
            ctx.fillStyle = "#dcdde1"; ctx.fillRect(0, yOffsetB, entryB, 100);
            ctx.fillStyle = "#34495e"; ctx.fillRect(entryB, yOffsetB, zone1Len, 100);
            ctx.fillStyle = "#2c3e50"; ctx.fillRect(transB, yOffsetB, canvas.width - transB, 100);

            zTexOffset -= z;
            yTexOffset -= ((speedA + speedB) / 2);

            drawBeltTexture(entryA, 50, zone1Len, 100, z, true);
            drawBeltTexture(transA, 50, canvas.width - transA, 100, speedA, false);
            drawBeltTexture(entryB, yOffsetB, zone1Len, 100, z, true);
            drawBeltTexture(transB, yOffsetB, canvas.width - transB, 100, speedB, false);

            ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
            ctx.font = "bold 11px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("ZONE 1", entryA + zone1Len/2, 65);
            ctx.fillText(`ZONE 2 (v=${speedA.toFixed(1)})`, transA + (canvas.width - transA)/2, 65);
            ctx.fillText("ZONE 1", entryB + zone1Len/2, yOffsetB + 15);
            ctx.fillText(`ZONE 2 (v=${speedB.toFixed(1)})`, transB + (canvas.width - transB)/2, yOffsetB + 15);

            // Entry/Transition Markers
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#f1c40f"; 
            ctx.beginPath(); ctx.moveTo(entryA, 50); ctx.lineTo(entryA, 150); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(entryB, yOffsetB); ctx.lineTo(entryB, yOffsetB + 100); ctx.stroke();
            ctx.strokeStyle = "#e74c3c"; 
            ctx.beginPath(); ctx.moveTo(transA, 50); ctx.lineTo(transA, 150); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(transB, yOffsetB); ctx.lineTo(transB, yOffsetB + 100); ctx.stroke();

            // Neutral Dividers
            ctx.fillStyle = "#bdc3c7"; 
            ctx.fillRect(0, 150, canvas.width, 5); 
            ctx.fillRect(0, yOffsetB - 5, canvas.width, 5);
        }

        function drawPerson(x, y, color, speedLabel, isWalking) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = color;
            ctx.fillRect(-12, -60, 24, 50);
            ctx.beginPath(); ctx.arc(0, -75, 12, 0, Math.PI * 2); ctx.fill();

            let walkRate = parseFloat(document.getElementById('walkSlider').value);
            let legAngle = isWalking ? Math.sin(frame * walkRate * 0.15) * 18 : 0;
            ctx.strokeStyle = "#222"; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(0, -15); ctx.lineTo(legAngle, 5); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, -15); ctx.lineTo(-legAngle, 5); ctx.stroke();

            ctx.fillStyle = "rgba(0,0,0,0.8)";
            ctx.font = "bold 14px monospace"; ctx.textAlign = "center";
            ctx.fillText("v=" + speedLabel, 0, -100);
            ctx.restore();
        }

        function animate() {
            const x = parseFloat(document.getElementById('walkSlider').value);
            const z = parseFloat(document.getElementById('zSlider').value);
            const yBase = parseFloat(document.getElementById('ySlider').value);
            
            document.getElementById('xVal').innerText = x.toFixed(1);
            document.getElementById('zVal').innerText = z.toFixed(1);
            document.getElementById('yVal').innerText = yBase.toFixed(1);

            let speedA, walkA = false;
            if (xPosA < entryA) { speedA = x; walkA = true; }
            else if (xPosA < transA) { speedA = z; }
            else { 
                if (z2StartA === null) z2StartA = frame;
                speedA = yBase + ((frame - z2StartA) / 60 * 0.1); 
            }
            xPosA += speedA;

            let speedB, walkB = false;
            if (xPosB < entryB) { speedB = x; walkB = true; }
            else if (xPosB < transB) { speedB = z; }
            else { 
                if (z2StartB === null) z2StartB = frame;
                speedB = yBase + ((frame - z2StartB) / 60 * 0.1); 
            }
            xPosB += speedB;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawEnvironment(z, yBase, (xPosA < transA ? yBase : speedA), (xPosB < transB ? yBase : speedB));

            drawDistanceMarker(xPosA, xPosB);

            if (xPosA > canvas.width + 50 && xPosB > canvas.width + 50) {
                xPosA = 0; xPosB = 0;
                z2StartA = null; z2StartB = null;
            }

            drawPerson(xPosA, 135, "#e67e22", speedA.toFixed(2), walkA);
            drawPerson(xPosB, 385, "#3498db", speedB.toFixed(2), walkB); // Increased Y for B

            frame++;
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
